name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag value
        required: true
        type: string
    secrets:
      google-chat-webhook-url:
        description: The Webhook URL for the chat to send the message to
        required: true
      gpg-private-key:
        description: The private SSH key used for signing the Git tag.
        required: true
      gpg-private-key-password:
        description: The password for the private SSH key used for signing the Git tag.
        required: true
      token:
        description: Token for github interaction
        required: true

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
          token: '${{ secrets.token }}'
      - name: Tag
        uses: cupel-co/actions/.github/actions/release/tag@f0995465d50036e76ec0d4d7886f33818b710c49
        with:
          gpg-key: '${{ secrets.gpg-private-key }}'
          gpg-password: '${{ secrets.gpg-private-key-password }}'
          tag: '${{ inputs.tag }}'

  github:
    name: GitHub
    runs-on: ubuntu-latest
    needs:
      - tag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
          token: '${{ secrets.token }}'
      - name: Release
        uses: cupel-co/actions/.github/actions/release/create@f0995465d50036e76ec0d4d7886f33818b710c49
        with:
          tag: '${{ inputs.tag }}'
          token: '${{ secrets.token }}'

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - github
    steps:
      - name: Release
        uses: cupel-co/actions/.github/actions/release/notify@f0995465d50036e76ec0d4d7886f33818b710c49
        with:
          google-chat-webhook-url: '${{ secrets.google-chat-webhook-url }}'
          tag: '${{ inputs.tag }}'
