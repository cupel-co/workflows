name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag value
        required: true
        type: string
    secrets:
      google-chat-webhook-url:
        description: The webhook URL used to send release notifications to Google Chat
        required: true
      gpg-private-key:
        description: The armored GPG private key used to sign the Git tag.
        required: true
      gpg-private-key-password:
        description: The password for the GPG private key used to sign the Git tag.
        required: true
      token:
        description: A GitHub token with permission to push tags and create releases
        required: true

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
          token: '${{ secrets.token }}'
      - name: Tag
        uses: cupel-co/actions/.github/actions/release/tag@d6ada7c3046e8a1509a6c333da8e950a6354e427
        with:
          gpg-key: '${{ secrets.gpg-private-key }}'
          gpg-password: '${{ secrets.gpg-private-key-password }}'
          tag: '${{ inputs.tag }}'

  github:
    name: GitHub
    runs-on: ubuntu-latest
    needs:
      - tag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
          token: '${{ secrets.token }}'
      - name: Release
        uses: cupel-co/actions/.github/actions/release/create@d6ada7c3046e8a1509a6c333da8e950a6354e427
        with:
          tag: '${{ inputs.tag }}'
          token: '${{ secrets.token }}'

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - github
    steps:
      - name: Release
        uses: cupel-co/actions/.github/actions/release/notify@d6ada7c3046e8a1509a6c333da8e950a6354e427
        with:
          google-chat-webhook-url: '${{ secrets.google-chat-webhook-url }}'
          tag: '${{ inputs.tag }}'
