name: Pull Request Update

on:
  workflow_call:
    inputs:
      environment:
        description: The environment name to inject into the pull request description.
        required: true
        type: string
    outputs:
      description:
        description: The rendered pull request description.
        value: '${{ jobs.update.outputs.description }}'

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    outputs:
      description: '${{ steps.update.outputs.description }}'
    steps:
      - name: Update
        id: update
        uses: cupel-co/actions/.github/actions/pull-request/update@502558aad78e09cf95cb28d657ea824cc0237298
        with:
          environment: ${{ inputs.environment }}
