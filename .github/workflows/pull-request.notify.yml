name: Pull Request Notify

on:
  workflow_call:
    secrets:
      google-chat-webhook-url:
        description: The URL for sending messages to Google Chat
        required: true

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - name: Google Chat
        uses: cupel-co/actions/.github/actions/pull-request/notify@d6ada7c3046e8a1509a6c333da8e950a6354e427
        with: 
          google-chat-webhook-url: '${{ secrets.google-chat-webhook-url }}'
