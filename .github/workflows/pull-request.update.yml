name: Pull Request Update

on:
  workflow_call:
    inputs:
      environment:
        description: The name of the artifact to upload after the plan step.
        required: true
        type: string
    outputs:
      major:
        description: The Major value
        value: '${{ jobs.update.outputs.description }}'

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    outputs:
      description: '${{ steps.update.outputs.description }}'
    steps:
      - name: Update
        id: update
        uses: cupel-co/actions/.github/actions/pull-request/update@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          environment: ${{ inputs.environment }}
