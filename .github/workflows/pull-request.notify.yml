name: Pull Request Notify

on:
  workflow_call:
    secrets:
      google-chat-webhook-url:
        description: The URL for sending messages to Google Chat
        required: true

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - name: Google Chat
        uses: cupel-co/actions/.github/actions/pull-request/notify@f0995465d50036e76ec0d4d7886f33818b710c49
        with: 
          google-chat-webhook-url: '${{ secrets.google-chat-webhook-url }}'
