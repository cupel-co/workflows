name: Release Notify

on:
  workflow_call:
    inputs: 
      tag:
        description: The release tag to include in the notification
        required: true
        type: string
    secrets:
      google-chat-webhook-url:
        description: The URL for sending messages to Google Chat
        required: true

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - name: Google Chat
        uses: cupel-co/actions/.github/actions/release/notify@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: 
          google-chat-webhook-url: '${{ secrets.google-chat-webhook-url }}'
          tag: '${{ inputs.tag }}'
